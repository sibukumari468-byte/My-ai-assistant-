<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        #mic-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 32px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: transform 0.2s;
        }
        #mic-btn:active { transform: scale(0.95); }
        #mic-btn.listening {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        #status { margin-top: 15px; font-weight: bold; color: #38bdf8; min-height: 20px; }
        #chat-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            min-height: 100px;
            text-align: left;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-text { color: #94a3b8; margin-bottom: 8px; }
        .ai-text { color: #e2e8f0; }
        a { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Voice Assistant</h1>
        <p>माइक दबाएं और बोलें</p>
        <button id="mic-btn">🎤</button>
        <div id="status">तैयार है</div>
        <div id="chat-box">
            <div class="ai-text">नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?</div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusDiv = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusDiv.innerText = "आपका ब्राउज़र वॉयस सपोर्ट नहीं करता। Chrome का उपयोग करें।";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusDiv.innerText = "सुन रहा हूँ...";
            };

            recognition.onspeechend = () => {
                micBtn.classList.remove('listening');
                statusDiv.innerText = "सोच रहा हूँ...";
                recognition.stop();
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                chatBox.innerHTML = `<div class="user-text"><b>आप:</b> ${transcript}</div>`;
                
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: transcript })
                    });
                    const data = await response.json();
                    const reply = data.reply || data.error || "कोई जवाब नहीं मिला।";
                    
                    // Convert URLs to clickable links
                    const formattedReply = reply.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">यहाँ क्लिक करें</a>');
                    chatBox.innerHTML += `<div class="ai-text"><b>AI:</b> ${formattedReply}</div>`;
                    statusDiv.innerText = "तैयार है";
                    
                    // Speak response (strip URLs for cleaner speech)
                    const speechText = reply.replace(/(https?:\/\/[^\s]+)/g, '');
                    speak(speechText);
                } catch (err) {
                    statusDiv.innerText = "सर्वर से जुड़ने में त्रुटि।";
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                statusDiv.innerText = "आवाज़ समझ नहीं आई, फिर से प्रयास करें।";
            };
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
