<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2563eb;
        }
        #response {
            margin-top: 20px;
            font-size: 16px;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Voice Assistant</h2>
        <p>Click the button and start speaking...</p>
        <button id="recordBtn">🎤 Speak</button>
        <div id="response">Your answer will appear here...</div>
    </div>

    <script>
        const btn = document.getElementById('recordBtn');
        const responseDiv = document.getElementById('response');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            responseDiv.innerText = "Speech recognition is not supported in this browser. Try Chrome.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            btn.addEventListener('click', () => {
                recognition.start();
                responseDiv.innerText = "Listening...";
            });

            recognition.onresult = async (event) => {
                const speechText = event.results[0][0].transcript;
                responseDiv.innerText = "You said: " + speechText + "\nThinking...";

                try {
                    const res = await fetch('/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: speechText })
                    });
                    const data = await res.json();
                    responseDiv.innerText = "AI: " + data.response;
                    
                    // Text to Speech
                    const speech = new SpeechSynthesisUtterance(data.response);
                    window.speechSynthesis.speak(speech);
                } catch (err) {
                    responseDiv.innerText = "Error connecting to server.";
                }
            };
        }
    </script>
</body>
</html>
